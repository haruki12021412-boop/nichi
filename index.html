<!doctype html>
<html lang="ja">
<head><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>nichi — 日付デモ</title>
<style>
/* ── デザインシステム ─────────────────────────────
 余白: 4pt グリッド / 画面マージン 24 / 角丸: カード24・グループ20・チップ14・ボタン円
 文字: SF（rem）/ 数字は Outfit / タップ領域 44 以上
 ガラス: バー・ボタン・メニュー・スタンプホイール・トーストだけ。カードと本文は不透明
 背景: いちばん近い日付のテーマ色から作る固定グラデーション（スクロールしても動かない） */
:root{--bg:#f7f6f3;--surface:#fff;--ink:#111;--muted:#6b6b70;--line:rgba(0,0,0,.08);--fill:rgba(120,120,128,.12);--btn:#0071e3;--btntext:#fff;--danger:#d70015;--accent:#0071e3;--ring:rgba(17,17,17,.6);--navtint:rgba(247,246,243,.55);--lav:#dcd3ff;--lime:#e3f58c;--coral:#ffc6b8;--sky:#c9e6ff;--pink:#ffd1e8;--mint:#c6f0d8;--peach:#ffd9a8;--red:#e5372d;--orange:#f2711c;--yellow:#ffd60a;--green:#23913f;--teal:#0b7f8a;--blue:#2f6df6;--indigo:#4b3fd1;--purple:#8e3fd1;--rose:#d6336c;--brown:#8b5a3c;--graphite:#4a4f57;
--g-bg:rgba(255,255,255,.56);--g-hi:rgba(255,255,255,.95);--g-edge:rgba(0,0,0,.07);--thumb:rgba(255,255,255,.9);--scrim:rgba(0,0,0,.32);
--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.22,1.12,.36,1);--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:20px;--sp6:24px;--sp8:32px;--r-card:24px;--r-grp:20px;--r-chip:14px;--dur:.28s;--sh0:0 1px 2px rgba(0,0,0,.05);--sh1:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);--sh2:0 2px 4px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.08);--hi:inset 0 0 0 0 transparent;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--ink:#fff;--muted:#98989d;--line:rgba(255,255,255,.14);--fill:rgba(120,120,128,.24);--danger:#ff453a;--accent:#2e90ff;--ring:rgba(255,255,255,.7);--navtint:rgba(0,0,0,.45);--sh0:0 1px 2px rgba(0,0,0,.5);--sh1:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4);--sh2:0 2px 4px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.55);--hi:inset 0 1px 0 rgba(255,255,255,.07);--lav:#5b4f7d;--lime:#4f5e1b;--coral:#74493f;--sky:#34546a;--pink:#744058;--mint:#3d6650;--peach:#755636;--g-bg:rgba(44,44,46,.6);--g-hi:rgba(255,255,255,.16);--g-edge:rgba(255,255,255,.1);--thumb:rgba(255,255,255,.16);--scrim:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#000;--surface:#1c1c1e;--ink:#fff;--muted:#98989d;--line:rgba(255,255,255,.14);--fill:rgba(120,120,128,.24);--danger:#ff453a;--accent:#2e90ff;--ring:rgba(255,255,255,.7);--navtint:rgba(0,0,0,.45);--sh0:0 1px 2px rgba(0,0,0,.5);--sh1:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4);--sh2:0 2px 4px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.55);--hi:inset 0 1px 0 rgba(255,255,255,.07);--lav:#5b4f7d;--lime:#4f5e1b;--coral:#74493f;--sky:#34546a;--pink:#744058;--mint:#3d6650;--peach:#755636;--g-bg:rgba(44,44,46,.6);--g-hi:rgba(255,255,255,.16);--g-edge:rgba(255,255,255,.1);--thumb:rgba(255,255,255,.16);--scrim:rgba(0,0,0,.55)}
html{font-size:17px;font:-apple-system-body;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.3;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;margin:0}button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.ic{display:block;flex:none}
.glass{background:var(--g-bg);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 .5px var(--g-edge),0 6px 22px rgba(0,0,0,.1)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--surface)}}
@media (prefers-contrast:more),(prefers-reduced-transparency:reduce){.glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 2px var(--muted)}}
/* 背景（予定連動・固定） */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none}
.bgl{position:absolute;inset:0;opacity:0;transition:opacity .7s cubic-bezier(.4,0,.2,1)}.bgl.on{opacity:1}
/* ページャー */
.pager{position:fixed;inset:0;z-index:1;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.track{display:flex;height:100%;width:100%;will-change:transform}
.pane{flex:none;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);scrollbar-width:none}
.pane::-webkit-scrollbar,.solo::-webkit-scrollbar{display:none}
.solo{position:fixed;inset:0;z-index:1;overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);scrollbar-width:none}
.app{position:relative;max-width:560px;margin:0 auto;padding:0 var(--sp6) 200px;min-height:100%}
.lt{padding:56px 0 var(--sp4)}
.lrow{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp3)}.mn{display:flex;gap:var(--sp2);flex:none}
.cap{margin:0;font-size:.82rem;color:var(--muted);font-weight:500;min-height:1.2em}
h1{position:relative;margin:var(--sp1) 0 0;min-height:1.15em;font-size:2rem;line-height:1.15;font-weight:700;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.dg{display:inline-block;white-space:pre}.old{position:absolute;left:0;top:0;white-space:pre;pointer-events:none}
.rail{position:absolute;left:0;top:0;bottom:0;width:var(--sp6);z-index:2;-webkit-touch-callout:none}
.rail:focus-visible{outline-offset:-3px}
.nav{position:fixed;top:0;left:0;right:0;z-index:35;padding-top:env(safe-area-inset-top,0px);pointer-events:none;--p:0}
.nav:before{content:"";position:absolute;inset:0 0 -16px;background:linear-gradient(var(--navtint) 50%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);opacity:var(--p)}
.nav-in{position:relative;max-width:560px;margin:0 auto;height:56px;padding:0 var(--sp6);display:flex;align-items:center;justify-content:space-between;gap:var(--sp3)}
.nt{position:absolute;left:0;right:0;text-align:center;font-weight:600;opacity:var(--p);pointer-events:none}
.na{margin-left:auto;display:flex;gap:var(--sp2);pointer-events:auto;position:relative}
.gbtn{min-width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-weight:600;color:var(--ink)}
.gbtn.pill{padding:0 var(--sp5)}.gbtn.tint{background:var(--btn);color:var(--btntext)}
.gbtn:active,.fab:active{transform:scale(.92)}.gbtn,.fab{transition:transform .35s var(--ease)}
/* セグメント */
.seg{position:relative;display:flex;padding:3px;background:var(--fill);border-radius:14px;--n:3;--i:0}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:11px;background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 0 0 .5px var(--line);transform:translateX(calc(var(--i)*100%));transition:transform .5s var(--ease)}
.seg button{position:relative;flex:1;min-height:38px;border-radius:11px;font-size:.88rem;font-weight:500;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.search{display:flex;align-items:center;gap:var(--sp2);height:44px;margin:var(--sp3) 0 var(--sp6);padding:0 var(--sp3);border-radius:14px;background:var(--fill);color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;color:var(--ink);-webkit-user-select:text;user-select:text}
/* 一覧 */
#list{display:flex;flex-direction:column;gap:var(--sp3)}
.sec{font-size:1.18rem;font-weight:700;margin:var(--sp3) 0 0}.sec:first-child{margin-top:0}
.row{display:flex;gap:var(--sp3);align-items:center}
.card{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp4);text-align:left;padding:var(--sp5);border-radius:var(--r-card);background:var(--surface);--edge:inset 0 0 0 1px var(--line);box-shadow:var(--sh1),var(--edge),var(--hi);overflow:hidden;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
@media (hover:hover){.card:hover{z-index:1;transform:translateY(-1px);box-shadow:var(--sh2),var(--edge),var(--hi)}}
.card:active{transform:scale(.985);box-shadow:var(--sh0),var(--edge),var(--hi)}
.card>*{position:relative}
.card.feat{background:var(--g);--edge:inset 0 0 0 0 transparent}
.head{display:flex;align-items:center;gap:var(--sp3)}
.chip{flex:none;width:44px;height:44px;border-radius:var(--r-chip);display:grid;place-items:center;font-size:1.35rem;background:var(--g);color:var(--ink)}
.feat .chip{background:rgba(255,255,255,.55)}:root[data-theme="dark"] .feat .chip{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .feat .chip{background:rgba(0,0,0,.25)}}
.ttl{font-weight:600;font-size:1rem;line-height:1.3;overflow-wrap:anywhere;min-width:0}.ttl small{display:block;font-size:.76rem;font-weight:600;margin-bottom:2px}.ttl .sub{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin:2px 0 0}
.cnt{display:flex;align-items:baseline;gap:var(--sp2);flex-wrap:wrap;font-family:"Outfit",-apple-system,"SF Pro Display",system-ui,sans-serif}
.cnt b{font-size:3.2rem;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.feat .cnt b{font-size:4.6rem}
.cnt span{font-size:1.1rem;font-weight:700}
.dt{display:flex;align-items:center;gap:var(--sp2);font-size:.88rem;color:var(--muted)}.feat .dt{color:var(--ink)}
.mv{display:flex;flex-direction:column;gap:var(--sp2)}.mv button{width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}.mv button:disabled{opacity:.3}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp3);padding:64px var(--sp4) var(--sp8)}.empty.sm{padding:var(--sp6) var(--sp4)}
.empty .ico{display:grid;place-items:center;color:var(--muted);opacity:.85;margin-bottom:var(--sp1)}.empty .ico .ic{stroke-width:1.25}
.empty h3{margin:0;font-size:1.3rem;letter-spacing:-.01em}.empty p{margin:0;color:var(--muted);font-size:.94rem;line-height:1.5}
.btn{height:50px;padding:0 var(--sp6);border-radius:25px;background:var(--btn);color:var(--btntext);font-weight:600;margin-top:var(--sp3);transition:transform .35s var(--ease)}.btn:active{transform:scale(.96)}
/* カレンダー */
.cal{background:var(--surface);border-radius:var(--r-card);padding:var(--sp2) var(--sp2) var(--sp3);box-shadow:var(--sh1),inset 0 0 0 1px var(--line);margin-bottom:var(--sp6)}
.wk,.cg{display:grid;grid-template-columns:repeat(7,1fr)}
.wk span{text-align:center;font-size:.72rem;color:var(--muted);font-weight:600;padding:var(--sp2) 0}
.dc{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
.dc b{font-weight:inherit;line-height:1}.dc.today b{color:var(--accent);font-weight:700}
.dc[aria-pressed="true"]{background:var(--ink);color:var(--bg)}.dc[aria-pressed="true"].today b{color:var(--bg)}
.dc .mk{display:flex;gap:3px;height:6px}.dc .mk i{width:6px;height:6px;border-radius:3px;background:var(--w);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28)}
.dc.out{visibility:hidden}
/* 場所 */
.map{position:relative;height:220px;border-radius:var(--r-card);overflow:hidden;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);margin:var(--sp4) 0}
.map .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:.88rem;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;text-align:center;padding:0 var(--sp6)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.v.sel,.cell .v{-webkit-user-select:text;user-select:text}
/* ドック */
.edge{position:fixed;left:0;right:0;bottom:0;height:calc(150px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 75%);pointer-events:none;z-index:15}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--sp3) + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:var(--sp3);padding:0 var(--sp5);z-index:20}
.dots{position:fixed;left:0;right:0;bottom:calc(var(--sp3) + 68px + 4px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:19;pointer-events:none}
.dots button{pointer-events:auto;width:44px;height:32px;display:grid;place-items:center}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--muted);opacity:.45;transition:width .35s var(--ease),opacity .25s,background .25s}
.dots [aria-selected="true"] i{width:18px;opacity:1;background:var(--ink)}
.tabs{position:relative;display:flex;padding:4px;width:min(260px,calc(100% - 76px));border-radius:36px;--i:0}
.tabs .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);border-radius:32px;background:var(--thumb);box-shadow:inset 0 0 0 .5px var(--g-edge);transform:translateX(calc(var(--i)*100%));transition:transform .55s var(--ease)}
.tabs button{position:relative;flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp1);font-size:.7rem;font-weight:600;color:var(--muted);transition:color .25s}
.tabs button[aria-current="page"]{color:var(--accent)}
.fab{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--btntext);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 22px rgba(0,0,0,.16)}
/* メニュー・シート・アラート */
.pscrim{position:fixed;inset:0;z-index:30}
.menu{position:absolute;top:calc(100% + 8px);right:0;min-width:240px;border-radius:var(--r-grp);padding:var(--sp1);transform-origin:top right;animation:popm .35s var(--ease)}
.menu button{width:100%;min-height:44px;display:flex;align-items:center;gap:var(--sp3);padding:0 var(--sp3);border-radius:16px;text-align:left}
.menu button span{flex:1}.menu button:active{background:var(--fill)}.menu hr{border:0;height:1px;background:var(--line);margin:var(--sp1) var(--sp3)}
@keyframes popm{from{opacity:0;transform:scale(.88)}}
#layer{position:fixed;inset:0;z-index:40;pointer-events:none}#layer.in{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .4s var(--ease)}#layer.in .scrim{opacity:1}
.sheet{position:absolute;left:50%;bottom:0;width:min(560px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:32px 32px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.16),inset 0 1px 0 var(--line);padding:0 var(--sp5) calc(var(--sp6) + env(safe-area-inset-bottom,0px));transform:translate(-50%,100%);transition:transform .62s var(--ease)}
#layer.in .sheet{transform:translate(-50%,0)}
.drag{touch-action:none}.grab{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:var(--sp2) auto 0}
.sh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:var(--sp3);padding:var(--sp3) 0 var(--sp4);position:sticky;top:0;background:var(--bg);z-index:2}
.sh h2{margin:0;font-size:1.06rem;text-align:center}.sh .gbtn{width:44px;padding:0}
.alert{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}.alert.in{pointer-events:auto}
.ascrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}.alert.in .ascrim{opacity:1}
.abox{position:relative;width:min(300px,calc(100% - 48px));border-radius:var(--r-grp);background:var(--surface);overflow:hidden;opacity:0;transform:scale(1.08);transition:opacity .25s,transform .35s var(--ease)}.alert.in .abox{opacity:1;transform:none}
.at{padding:var(--sp5) var(--sp4) var(--sp4);text-align:center}.at b{display:block;font-size:1.02rem}.at p{margin:var(--sp1) 0 0;font-size:.82rem;color:var(--muted);line-height:1.4}
.ab{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.ab button{height:50px;font-size:1.02rem;color:var(--accent)}.ab button+button{border-left:1px solid var(--line);font-weight:700;color:var(--danger)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--sp2));z-index:90;display:flex;align-items:center;gap:var(--sp2);height:44px;padding:0 var(--sp4);border-radius:22px;font-weight:600;font-size:.9rem;opacity:0;transform:translate(-50%,-24px) scale(.9);transition:opacity .3s,transform .5s var(--ease);pointer-events:none;max-width:calc(100% - 32px);white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
/* フォーム・グループ */
.gl{margin:var(--sp6) var(--sp4) var(--sp2);font-size:.82rem;color:var(--muted);font-weight:500}.gl:first-child{margin-top:0}
.grp{background:var(--surface);border-radius:var(--r-grp);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.cell{display:flex;align-items:center;justify-content:space-between;gap:var(--sp3);min-height:52px;padding:var(--sp2) var(--sp4);width:100%;text-align:left;text-decoration:none}
.cell+.cell{position:relative}.cell+.cell:before{content:"";position:absolute;top:0;left:var(--sp4);right:0;height:1px;background:var(--line)}
.cell input,.cell textarea{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink);-webkit-user-select:text;user-select:text}.cell textarea{min-height:88px;resize:none;padding:var(--sp2) 0;line-height:1.4}
.cell input[type=date]{flex:none;color-scheme:light dark}
.cell .v{font-weight:600;text-align:right;overflow-wrap:anywhere}.cell.dg{color:var(--danger);justify-content:center;font-weight:500}.cell.ac{color:var(--accent)}
.cell.ctr{justify-content:center;font-weight:500}.cell.col{flex-direction:column;align-items:stretch;padding:var(--sp3) var(--sp4)}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sp2)}.sw button{height:44px;border-radius:var(--r-chip);background:var(--g);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);transition:box-shadow .25s}
.sw button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.em{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:var(--sp1)}
.em button{height:44px;border-radius:12px;font-size:1.35rem;display:grid;place-items:center;color:var(--muted);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .25s}
.em button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:var(--fill)}
.err{display:flex;align-items:center;gap:var(--sp2);margin:var(--sp2) var(--sp4) 0;color:var(--danger);font-size:.82rem}
.nb button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--line)}.em.nb button[aria-pressed="true"]{color:var(--ink)}
