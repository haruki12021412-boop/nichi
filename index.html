 const pv=()=>{const v=$("#d").value;$("#pv").textContent=parse(v)?cnt(diff(v)).ph:""};pv();
 const mark=v=>$$("#em [data-sy]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sy===v)));
 $("#d").oninput=pv;$("#em").onclick=ev=>{const b=ev.target.closest("[data-sy]");if(b){d.symbol=b.dataset.sy;$("#s").value=d.symbol;mark(d.symbol)}};
 $("#s").oninput=()=>{d.symbol=$("#s").value.trim();mark(d.symbol)};
 $("#sw").onclick=ev=>{const b=ev.target.closest("[data-th]");if(!b)return;d.theme=b.dataset.th;$$("#sw button").forEach(x=>{const on=x===b;x.setAttribute("aria-pressed",on);x.innerHTML=on?I("check",20):""});pvImg()};
 const pvImg=()=>{const b=$("#pvb");b.style.setProperty("--w",`var(--${d.theme})`);b.className="pvb"+(d.img?" img":"");b.innerHTML=d.img?bg(d):"写真なし";$("#rm").hidden=!d.img};pvImg();
 $("#pick").onclick=()=>$("#file").click();$("#rm").onclick=()=>{d.img="";$("#file").value="";pvImg()};
 $("#file").onchange=async ev=>{const fl=ev.target.files[0];if(!fl)return;$("#e-i").innerHTML="";try{d.img=await shrink(fl);pvImg()}catch(x){$("#e-i").innerHTML=`<p class="err" role="alert">${I("warn",16)}この写真は読み込めませんでした。</p>`}};
 const len=s=>[...(Intl.Segmenter?new Intl.Segmenter("ja",{granularity:"grapheme"}).segment(s):s)].length;
 const submit=async()=>{const title=$("#t").value.trim(),date=$("#d").value,sym=$("#s").value.trim(),note=$("#n").value.trim(),er={};
  if(!title)er.t="タイトルを入力してください。";else if(len(title)>40)er.t="タイトルは40文字までです。";
  if(!parse(date))er.d="日付を選んでください。";
  if(sym&&(len(sym)!==1||/^[\x00-\x7f]*$/.test(sym)))er.s="絵文字は1つだけ入力してください。";
  if(note.length>500)er.n="メモは500文字までです。";
  ["t","d","s","n"].forEach(k=>{$("#e-"+k).innerHTML=er[k]?`<p class="err" role="alert">${I("warn",16)}${er[k]}</p>`:""});
  const f=Object.keys(er)[0];if(f){$({t:"#t",d:"#d",s:"#s",n:"#n"}[f]).focus();return}
  const item={id:e?e.id:uid(),title,date,theme:d.theme,symbol:sym,note,img:d.img,order:e?e.order:Math.max(-1,...S.events.map(x=>x.order))+1};
  const l=e?S.events.map(x=>x.id===e.id?item:x):[...S.events,item];
  if(!save(l))return;await dismiss(true);S.events=l;S.filter="all";S.q="";S.reorder=false;if(S.tab!=="home"){S.tab="home";renderTab()}else renderHome();toast(e?"変更を保存しました":"日付を追加しました");const r=$(`[data-id="${item.id}"]`);r&&r.scrollIntoView({block:"center",behavior:RM?"auto":"smooth"})};
 $("#ok").onclick=submit;$("#f").onsubmit=ev=>{ev.preventDefault();submit()}}
async function del(id){const e=S.events.find(x=>x.id===id);if(!e)return;if(!await ask("この日付を削除しますか？",`「${e.title}」を削除します。この操作は取り消せません。`,"削除"))return;
 await dismiss(true);const r=$(`[data-id="${id}"]`);if(r&&!RM){const h=r.offsetHeight;await r.animate([{height:h+"px",opacity:1,transform:"scale(1)"},{height:"0px",opacity:0,transform:"scale(.94)"}],{duration:340,easing:EASE,fill:"forwards"}).finished}
 if(commit(S.events.filter(x=>x.id!==id).sort((a,b)=>a.order-b.order).map((x,i)=>({...x,order:i}))))toast("削除しました","check")}
function move(id,k){const l=groups()[0].items.map(x=>x.e),i=l.findIndex(x=>x.id===id),j=i+k;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];commit(l.map((x,n)=>({...x,order:n})))}
/* ── 操作 ── */
document.addEventListener("click",async ev=>{const q=s=>ev.target.closest(s);let b;
 if(b=q("[data-tab]")){if(S.tab!==b.dataset.tab){S.tab=b.dataset.tab;S.reorder=false;renderTab()}return}
 if(b=q("[data-m]")){const k=b.dataset.m;closeMenu();if(k==="reorder"){S.reorder=true;renderNav();flip(renderList)}else{S.sort=k;S.reorder=false;try{localStorage.setItem(SKEY,k)}catch(e){}flip(renderList);renderNav()}return}
 if(b=q("[data-open]")){detail(b.dataset.open);return}
 if(b=q("[data-edit]")){await dismiss(true);editor(b.dataset.edit);return}
 if(b=q("[data-del]")){del(b.dataset.del);return}
 if(b=q("[data-filter]")){S.filter=b.dataset.filter;S.reorder=false;setSeg(b);flip(renderList);renderNav();return}
 if(b=q("[data-mv]")){const[id,k]=b.dataset.mv.split(":");move(id,+k);return}
 if(b=q("[data-tmode]")){setSeg(b);try{b.dataset.tmode==="system"?localStorage.removeItem(TKEY):localStorage.setItem(TKEY,b.dataset.tmode)}catch(e){}applyTheme();return}
 if(b=q("[data-sortset]")){setSeg(b);S.sort=b.dataset.sortset;S.reorder=false;try{localStorage.setItem(SKEY,S.sort)}catch(e){}return}
 if(b=q("[data-act]")){const a=b.dataset.act;
  if(a==="new")editor();else if(a==="menu")menu(!$("#mn"));else if(a==="menux")closeMenu();
  else if(a==="reorder"){S.reorder=false;renderNav();flip(renderList)}
  else if(a==="sheetx")dismiss();
  else if(a==="reset"){S.error=false;commit([])}
  else if(a==="seed"){if(await ask("サンプルに戻しますか？","いまの日付はすべて置き換わります。","戻す")){S.error=false;commit(seed());toast("サンプルに戻しました")}}
  else if(a==="wipe"){if(await ask("すべて削除しますか？","この操作は取り消せません。","削除")){S.error=false;commit([]);toast("すべて削除しました")}}}});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){S.q=ev.target.value;S.reorder=false;flip(renderList);renderNav()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){if($("#mn"))closeMenu();else if(layer.classList.contains("in")&&!$(".alert"))dismiss()}});
function applyTheme(){let t="system";try{t=localStorage.getItem(TKEY)||"system"}catch(e){}t==="system"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",t)}
let raf=0;addEventListener("scroll",()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;$("#nav").style.setProperty("--p",Math.min(1,Math.max(0,(scrollY-34)/28)))})},{passive:true});
try{S.sort=localStorage.getItem(SKEY)==="manual"?"manual":"nearest"}catch(e){}
applyTheme();load();renderTab();S.last=todayISO();
const tick=()=>{if(todayISO()!==S.last&&!layer.classList.contains("in")){S.last=todayISO();renderTab()}};
setInterval(tick,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});addEventListener("focus",tick);
</script>
</body>
